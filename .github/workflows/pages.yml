name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Droits minimaux par défaut : lecture du dépôt seulement (suffisant pour le job « build »).
# Les droits d'écriture Pages / OIDC ne sont accordés qu'au job « deploy » (voir plus bas).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Requis par actions/deploy-pages : publier sur Pages et prouver l'identité du workflow (jeton OIDC).
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
